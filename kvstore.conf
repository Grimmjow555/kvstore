# KVStore 配置文件
# 支持 key value 和 key=value 两种写法；# 或 ; 开头的行以及行尾注释会被忽略。

# 监听 IP。填 * 或 0.0.0.0 表示监听所有网卡。
bind 0.0.0.0

# 监听端口。
port 9999

# 日志级别：debug / info / warn / error / off。
log_level info

# 主从模式：master 或 replica（也接受 slave / 0 / 1）。
role master

# 以下两项仅在 role=replica 时使用。
master_ip 192.168.234.135
master_port 9999

# 持久化模式：none / rdb / aof / both。
# 也可继续使用 rdb on/off、aof on/off 独立控制。
# 默认关闭，需要持久化时再改为 rdb / aof / both。
persistence_mode none

# 内存分配方式：memorypool / jemalloc / malloc（也接受 system）。
#   memorypool  使用项目内置的 slab 内存池（默认，保持原有行为）
#   jemalloc    使用构建时链接进来的 libjemalloc
#   malloc      使用系统 malloc / calloc / free，不使用内存池
# 该选项在进程启动时确定，运行期间不能切换；选择 jemalloc 需要编译期已链接
# libjemalloc（CMake 会在配置阶段查找，找不到时直接报错）。
memory_allocator memorypool

# 网络架构（网络框架）：reactor / ntyco / proactor。
#   reactor   使用 epoll 事件循环的后端
#   ntyco     使用协程框架 NtyCo 的后端
#   proactor  使用 io_uring 的后端
# 三个后端都会编入同一个二进制，这里可自由选择，启动后按该值运行；
# 未设置时默认为 ntyco。
# 运行期间不能切换；同一台机器上可分别用不同配置文件启动不同实例。
network_architecture ntyco
