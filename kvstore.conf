# KVStore 配置文件
# 支持 key value 和 key=value 两种写法；# 或 ; 开头的行以及行尾注释会被忽略。

# 监听 IP。填 * 或 0.0.0.0 表示监听所有网卡。
bind 0.0.0.0

# 监听端口。
port 9999

# 日志级别：debug / info / warn / error / off。
log_level info

# 主从模式：master 或 replica（也接受 slave / 0 / 1）。
role master

# 以下两项仅在 role=replica 时使用。
master_ip 192.168.234.135
master_port 9999

# 持久化模式：none / rdb / aof，三者只能选一，RDB 与 AOF 不能同时开启。
# 也可继续使用 rdb on/off、aof on/off 独立控制；启用后启动时自动恢复。
# 默认关闭，需要持久化时再改为 rdb 或 aof。
persistence_mode none

# 网络架构（网络框架）：reactor / ntyco / proactor。
#   reactor   使用 epoll 事件循环的后端
#   ntyco     使用协程框架 NtyCo 的后端
#   proactor  使用 io_uring 的后端
# 三个后端都会编入同一个二进制，这里可自由选择，启动后按该值运行；
# 未设置时默认为 ntyco。
# 运行期间不能切换；同一台机器上可分别用不同配置文件启动不同实例。
network_architecture ntyco

# 阶段 2：RDMA 全量搬运由两个独立进程完成。
#   rdma-client：Master 在 SYNC 时派生，把 .tmp 发给 Replica
#   rdma-server：Replica 在发 SYNC 前派生，收到文件后落盘并退出
rdma_client_bin ./rdma-client
rdma_server_bin ./rdma-server
# RDMA 端口：Master 的 rdma-client 连接它，Replica 的 rdma-server 监听它。
rdma_port 10000
# Replica 主动连接 ebpf-agent 增量通道时使用的 Agent 监听端口。
agent_port 11001
# Master 同时允许的未完成全量同步会话数；多从机默认上限 16。
max_replicas 16
# 单个全量同步会话超时；0 表示按 RDMA 超时 + Replica 等待超时 + 30s 自动推导。
sync_session_timeout_ms 0
# Replica 默认通过控制连接自动选择 RDMA 地址。多网卡或测试环境可显式覆盖：
# rdma_advertise_host 192.168.234.129
# 旧配置键仍可解析，但新协议和所有 Replica 都不使用该值。
# replica_host 192.168.234.129
# rdma-client / rdma-server 的整体超时（毫秒），以及 Replica 等待文件落盘的超时。
rdma_transfer_timeout_ms 60000
sync_wait_timeout_ms 120000

# 阶段 3：增量采集与转发由独立的 ebpf-agent 进程负责（手动启动）。
#   uprobe：agent 在 master 二进制上挂 uprobe + ringbuf（需要 CAP_BPF/CAP_PERFMON）
#   sim   ：无 CAP_BPF 时，master 把记录写进下面的共享内存环，agent 读该环
# 采集进程未注册时 Master 会拒绝 SYNC（eBPF 强制）。
ebpf_capture_mode sim
ebpf_ring_file ../data/kvstore.ebpf.ring
