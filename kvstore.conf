# KVStore 配置文件
# 支持 key value 和 key=value 两种写法；# 或 ; 开头的行以及行尾注释会被忽略。

# 监听 IP。填 * 或 0.0.0.0 表示监听所有网卡。
bind 0.0.0.0

# 监听端口。
port 9999

# 日志级别：debug / info / warn / error / off。
log_level info

# 主从模式：master 或 replica（也接受 slave / 0 / 1）。
role master

# 以下两项仅在 role=replica 时使用。
master_ip 192.168.234.135
master_port 9999

# 持久化模式：none / rdb / aof / both。
# 也可继续使用 rdb on/off、aof on/off 独立控制。
persistence_mode both
