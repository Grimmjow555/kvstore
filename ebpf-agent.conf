# ebpf-agent 独立配置文件。
#
# 从 build/ 目录执行 ./ebpf-agent 时，程序会依次查找：
#   ./ebpf-agent.conf
#   ../ebpf-agent.conf
# 也可通过 ./ebpf-agent --config <path> 显式指定。
#
# 命令行开关会覆盖本文件中的同名字段。

# Agent 向 Master 注册的地址和 Master 的 TCP 数据端口。
master_ip 192.168.234.135
master_port 9999

# Replica 主动连接 Agent 的增量通道监听地址。
listen_ip 0.0.0.0
listen_port 11001

# 单 Agent 同时维护的 Replica 目标数，默认与 Master 一致为 16。
max_replicas 16

# sim：读取 Master 创建的共享内存环，不需要 CAP_BPF。
# uprobe：在 Master 二进制上挂探针，需要额外配置 master_pid/master_binary，
#         且 ebpf-agent 需要对应的 eBPF capability。
mode sim
ring ../data/kvstore.ebpf.ring

# uprobe 模式示例，启用时将 mode 改为 uprobe 并取消下面两行注释。
# master_pid 12345
# master_binary ./kvstore

# 每目标在全量同步期间允许缓存的最大字节数和命令条数。
cache_max_bytes 268435456
cache_max_records 500000
# 所有目标的缓存与待发送队列共享的内存预算。超限时只断开触发超限的目标。
memory_budget_bytes 1073741824
